<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Samuel Haas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Samuel Haas – freiberuflicher Frontend-Entwickler aus Balingen. Webanwendungen und Apps mit Vue.js und TypeScript.">
  <meta name="theme-color" content="#2B7A77" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d5653" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // apply a remembered light/dark choice before the first paint, see ThemeService
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
