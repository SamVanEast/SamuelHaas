<section class="welcome_section">
    <img src="assets/img/profile/welcome-960.webp"
        srcset="assets/img/profile/welcome-480.webp 480w, assets/img/profile/welcome-960.webp 960w, assets/img/profile/welcome-1440.webp 1440w, assets/img/profile/welcome-1920.webp 1920w"
        sizes="(max-width: 900px) 100vw, 52vw" width="1920" height="1280" fetchpriority="high"
        [alt]="i18n.t().welcome.portraitAlt">
    <div class="welcome">
        <h1 class="welcome_headline" appReveal="left">{{ i18n.t().welcome.headline }}</h1>
        <p class="welcome_text" appReveal="left">{{ i18n.t().welcome.text }}</p>
    </div>
</section>
