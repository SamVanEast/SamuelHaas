<section class="not_found" appReveal>
  <p class="not_found_code" aria-hidden="true">404</p>
  <h1 class="not_found_headline">{{ i18n.t().notFound.headline }}</h1>
  <p class="not_found_text">{{ i18n.t().notFound.text }}</p>
  <div class="not_found_actions">
    <a class="button button--primary" routerLink="/">{{ i18n.t().notFound.home }}</a>
    <a class="button button--secondary" href="/#portfolio" (click)="nav.goTo('portfolio', $event)">{{ i18n.t().notFound.portfolio }}</a>
  </div>
</section>
