<footer class="footer">
    <div class="indentation">
        <div class="footer_div">
            <a class="footer_logo_link" href="/#welcome" (click)="nav.goTo('welcome', $event)">
                <img class="footer_logo" src="assets/img/logos/logo-name-white.svg" alt="Samuel Haas" width="300" height="103">
            </a>
            <div class="social_media">
                <a href="https://www.xing.com/profile/Samuel_Haas9" target="_blank" rel="noopener noreferrer">
                    <img src="assets/icons/xing.png" alt="Xing" width="18" height="18">
                </a>
                <a href="https://github.com/SamVanEast" target="_blank" rel="noopener noreferrer">
                    <img src="assets/icons/github.png" alt="GitHub" width="18" height="18">
                </a>
                <a href="https://www.linkedin.com/in/samuel-haas-15ba5a237" target="_blank" rel="noopener noreferrer">
                    <img src="assets/icons/linkedIn.png" alt="LinkedIn" width="18" height="18">
                </a>
            </div>
            <nav class="legal_links" [attr.aria-label]="i18n.t().footer.legal">
                <a class="legal_link" routerLink="/impressum" (click)="scrollToTop()">{{ i18n.t().footer.imprint }}</a>
                <a class="legal_link" routerLink="/datenschutz" (click)="scrollToTop()">{{ i18n.t().footer.privacy }}</a>
            </nav>
        </div>
    </div>
</footer>
