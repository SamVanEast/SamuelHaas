<button type="button" class="theme_toggle" [attr.aria-pressed]="theme.theme() === 'dark'"
  [attr.aria-label]="i18n.t().header.darkMode" [title]="i18n.t().header.darkMode" (click)="theme.toggle()">
  @if (theme.theme() === 'dark') {
    <svg class="icon_sun" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  } @else {
    <svg class="icon_moon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linejoin="round" />
    </svg>
  }
</button>
