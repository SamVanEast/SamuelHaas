<header class="header">
    <div class="indentation header_content">
        <a class="logo" href="/#welcome" (click)="nav.goTo('welcome', $event)">
            <img src="assets/img/logos/logo-name-white.svg" alt="Samuel Haas" width="300" height="103">
        </a>

        <div class="header_actions">
            <nav class="menu" [attr.aria-label]="i18n.t().header.mainNavigation">
                @for (link of links; track link.id) {
                    <a class="menu_tab" [href]="'/#' + link.id" [class.active]="nav.activeSection() === link.id"
                        [attr.aria-current]="nav.activeSection() === link.id ? 'true' : null"
                        (click)="nav.goTo(link.id, $event)">{{ i18n.t().nav[link.id] }}</a>
                }
            </nav>

            <app-language-switch class="header_language" />
            <app-theme-toggle />

            <button #menuButton type="button" class="menu_button" [attr.aria-label]="i18n.t().header.openMenu"
                aria-controls="mobile-menu" [attr.aria-expanded]="menuOpen()" (click)="openMenu()">
                <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </div>
</header>

@if (menuOpen()) {
    <app-menu-mobile id="mobile-menu" [links]="links" (closed)="closeMenu()" />
}
